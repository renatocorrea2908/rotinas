name: Lojas - consultar ou liberar (Be Your Hero)

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'consultar (só leitura), liberar_ios ou oferta_legend_play (cria a oferta R$ 29,90 na Play)'
        type: choice
        options: [consultar, liberar_ios, oferta_legend_play]
        default: consultar
      versao_ios:
        description: 'Versão iOS a liberar (ex.: 1.0.2). Só usada em liberar_ios.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  lojas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet "pyjwt[crypto]" requests google-auth
      - name: Executar
        env:
          ACAO: ${{ inputs.acao }}
          VERSAO_IOS: ${{ inputs.versao_ios }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "$ACAO" = oferta_legend_play ]; then python .github/scripts/play_oferta.py; else python .github/scripts/lojas.py; fi
